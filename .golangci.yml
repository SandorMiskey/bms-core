# golangci-lint v2 configuration.
# Keeps the standard linter set (errcheck, govet, ineffassign, staticcheck,
# unused) so `just lint` has a defined rule set; extend deliberately.

version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofmt

